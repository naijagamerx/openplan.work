# Heap sized to fit a constrained machine (16GB with ~3GB free at build time).
# The original 8G heap caused JVM OOM crashes; 2G + 512m metaspace is enough
# for this app's compile. Bump back up on a machine with more free RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
