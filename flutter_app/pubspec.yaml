name: openplan_app
description: OpenPlan Work — native mobile client (Flutter).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0                    # HTTP client + interceptors
  flutter_riverpod: ^2.5.1      # state management
  flutter_secure_storage: ^9.0.0 # device token in Keychain/Keystore
  local_auth: ^2.2.0            # biometric unlock
  go_router: ^14.0.0            # routing + deep links
  intl: ^0.19.0                 # date formatting
  flutter_svg: ^2.0.10          # Heroicon outline path-data rendering
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  path_provider: 2.1.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  flutter_local_notifications: 18.0.1
  timezone: 0.10.0
  file_selector: 1.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
